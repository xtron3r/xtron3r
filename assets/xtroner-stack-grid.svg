      <text x="270" y="30" fill="#f3e8ff" font-size="13">TypeScript  ·  JavaScript  ·  HTML  ·  CSS  ·  React Native  ·  Expo  ·  Flutter  ·  Bootstrap  ·  Discord.js</text>
    </g>

