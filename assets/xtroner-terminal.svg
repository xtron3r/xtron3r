<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">XTRONER — software developer</title>
  <desc id="desc">A dark futuristic terminal interface with the XTRONER wordmark and software developer profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.58" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#160d2b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".24"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#67e8f9" stroke-opacity=".07"/>
    </pattern>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1400" height="520" rx="26" fill="url(#bg)"/>
  <rect width="1400" height="520" rx="26" fill="url(#glow)"/>
  <rect width="1400" height="520" rx="26" fill="url(#grid)"/>
  <path d="M0 465H1400" stroke="#67e8f9" stroke-opacity=".2"/>
  <path d="M1010 0L1400 390" stroke="#c084fc" stroke-opacity=".12" stroke-width="2"/>
  <path d="M1120 0L1400 280" stroke="#67e8f9" stroke-opacity=".1" stroke-width="2"/>

  <g transform="translate(82 72)">
    <rect width="1236" height="370" rx="18" fill="#050816" fill-opacity=".72" stroke="#67e8f9" stroke-opacity=".35"/>
    <path d="M0 54H1236" stroke="#67e8f9" stroke-opacity=".2"/>
    <circle cx="30" cy="27" r="6" fill="#fb7185"/>
    <circle cx="52" cy="27" r="6" fill="#facc15"/>
    <circle cx="74" cy="27" r="6" fill="#4ade80"/>
    <text x="104" y="32" fill="#94a3b8" font-family="monospace" font-size="14">xtroner://profile/overview</text>

    <text x="54" y="112" fill="#67e8f9" font-family="monospace" font-size="16">&gt; whoami</text>
    <text x="54" y="188" fill="url(#neon)" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="8" filter="url(#soft-glow)">XTRONER</text>
    <text x="58" y="226" fill="#cbd5e1" font-family="monospace" font-size="20">software developer / secure systems builder</text>

    <text x="54" y="282" fill="#67e8f9" font-family="monospace" font-size="16">&gt; focus --now</text>
    <text x="54" y="315" fill="#cbd5e1" font-family="monospace" font-size="17">cybersecurity  ·  full stack  ·  AI  ·  project management</text>
    <text x="54" y="350" fill="#64748b" font-family="monospace" font-size="15">Chile // architecture // delivery // continuous learning</text>
    <rect x="398" y="336" width="9" height="18" fill="#67e8f9">
      <animate attributeName="opacity" values="1;0;1" dur="1.25s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
